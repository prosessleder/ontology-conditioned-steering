[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-conditioned-steering"
version = "0.1.0"
description = "A reproducible, unrun research protocol for ontology-conditioned activation steering"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
model = ["torch==2.9.0", "transformers==4.57.1", "safetensors==0.6.2"]
test = ["pytest==8.4.2"]

[project.scripts]
ontology-steering = "ontology_steering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
